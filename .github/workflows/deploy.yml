name: Deploy to Elastic Beanstalk

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build jar
        run: ./gradlew bootJar

      # jar 만 올리면 .platform 이 빠져 nginx 기본 상한 1MB 가 그대로다(짤 업로드가 413).
      # EB Java SE 는 zip 안의 jar 하나를 찾아 실행하므로 jar 이름은 그대로 둔다
      - name: Package with .platform
        run: |
          mkdir -p build/bundle
          cp build/libs/backend-0.0.1-SNAPSHOT.jar build/bundle/
          cp -r .platform build/bundle/
          cd build/bundle && zip -qr ../deploy.zip . && cd -
          unzip -l build/deploy.zip

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: geoji-server
          environment_name: Geoji-server-env
          version_label: ${{ github.sha }}
          region: ap-northeast-2
          deployment_package: build/deploy.zip
