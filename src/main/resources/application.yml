spring:
  application:
    name: ttegeoji-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 supabase/migrations SQL이 유일한 소스다. Hibernate가 건드리지 않게 validate만 한다.
      ddl-auto: validate
    properties:
      hibernate:
        # 운영에서는 끈다. 내부 API 는 예산이 1~3초라(10 §4.7) 문장마다 포맷·기록하는 비용이 그대로 얹힌다.
        # 로컬에서 보고 싶으면 SHOW_SQL=true 로 띄운다
        format_sql: ${SHOW_SQL:false}
    show-sql: ${SHOW_SQL:false}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER_URI:https://wfovlprcxmsanfuzbfvd.supabase.co/auth/v1}

server:
  port: ${PORT:8080}

geoji:
  internal:
    # 워커 ↔ 백엔드 양방향 같은 값(10 §4.7). 비어 있으면 내부 API 는 전부 401
    service-token: ${SERVICE_AUTH_TOKEN:}
  ai:
    base-url: ${AI_API_BASE_URL:}
  # finalize 의 guardrail_policy_version 비교값(10 §5·§16.1)
  guardrail-policy-version: ${GUARDRAIL_POLICY_VERSION:}
  # 관리자 짤 업로드(10 §16.5). 버킷·리전이 비면 업로드만 503 이고 기동은 한다.
  # 자격증명은 여기 두지 않는다 — EB 인스턴스 프로파일을 기본 제공자 체인이 읽는다
  media:
    bucket: ${GEOJI_MEDIA_S3_BUCKET:}
    region: ${GEOJI_MEDIA_S3_REGION:}
    key-prefix: ${GEOJI_MEDIA_S3_PREFIX:memes}
    # CloudFront 를 앞에 두면 그 주소. 비면 S3 가상호스트 주소를 쓴다
    public-base-url: ${GEOJI_MEDIA_PUBLIC_BASE_URL:}
    # 업로드를 허용할 profiles.id 목록(쉼표 구분). 비면 아무도 못 올린다
    admin-ids: ${GEOJI_MEDIA_ADMIN_IDS:}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:info}
